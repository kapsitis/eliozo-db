# Alembic configuration for the Eliozo PostgreSQL + pgvector schema.
#
# The database URL is NOT stored here — it is assembled from the DB_* variables
# in `.env` by alembic/env.py, so the same migration runs unchanged on the macOS
# workstation (colima) and on the Ubuntu server.
#
#   alembic upgrade head      # apply all migrations
#   alembic downgrade -1      # roll back the last migration
#   alembic current           # show the applied revision

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
